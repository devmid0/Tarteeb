<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            if (localStorage.getItem('tarteeb_session_active') === 'true') {
                window.location.replace('app.html');
            } else {
                window.location.replace('index.html');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting — Tarteeb</title>
    <style>
        body { background: #0f0f11; color: #a1a1aa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: system-ui, sans-serif; }
        p { font-size: 14px; }
    </style>
</head>
<body>
    <p>Redirecting to Tarteeb&hellip;</p>
</body>
</html>
