        .vision-card-pill--done .vision-card-pill-label {
            text-decoration: line-through;
            text-decoration-color: rgba(113,113,122,0.4);
            text-decoration-thickness: 1px;
            color: #52525b;
        }
        .vision-card-pill--done .vision-card-pill-dot {
            background: #f472b6;
            box-shadow: 0 0 8px rgba(244,114,182,0.4);
        }

        /* Dot indicator */
        .vision-card-pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            flex-shrink: 0;
            transition: all 300ms cubic-bezier(0.34,1.56,0.64,1);
        }
        .vision-card-pill-dot--done {
            animation: pill-dot-pop 400ms cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes pill-dot-pop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.8); }
            100% { transform: scale(1); }
        }

        .vision-card-pill-label {
            font-size: 12px;
            font-weight: 500;
            color: #a1a1aa;
            transition: all 200ms ease;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* More indicator */
        .vision-card-pill--more {
            background: transparent;
            border: 1px dashed rgba(255,255,255,0.08);
            cursor: default;
            font-size: 11px;
            color: #52525b;
        }
        .vision-card-pill--more:hover {
            transform: none;
            background: transparent;
        }

        /* Delete button inside pill */
        .vision-card-pill-del {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            color: #52525b;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0;
            transition: all 120ms ease;
            flex-shrink: 0;
        }
        .vision-card-pill:hover .vision-card-pill-del {
            opacity: 1;
        }
        .vision-card-pill-del:hover {
            color: #ef4444;
            background: rgba(239,68,68,0.1);
        }

        /* ── Inline Add Milestone ────────────────────────────── */
        .vision-card-add-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        .vision-card-add-input {
            flex: 1;
            background: transparent;
            font-size: 12px;
            font-family: 'Inter', system-ui, sans-serif;
            color: #71717a;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px dashed rgba(255,255,255,0.06);
            outline: none;
            transition: border-color 150ms ease, background 150ms ease;
        }
        .vision-card-add-input::placeholder {
            color: #3f3f46;
        }
        .vision-card-add-input:hover {
            border-color: rgba(255,255,255,0.1);
        }
        .vision-card-add-input:focus {
            border-color: rgba(244,114,182,0.3);
            background: rgba(255,255,255,0.02);
        }
        .vision-card-add-btn {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(244,114,182,0.6);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 120ms ease;
        }
        .vision-card-add-btn:hover {
            color: #f472b6;
            background: rgba(244,114,182,0.08);
        }

        /* ── Card Footer (Actions) ───────────────────────────── */
        .vision-card-footer {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px 14px;
            border-top: 1px solid rgba(255,255,255,0.03);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        .vision-card:hover .vision-card-footer {
            opacity: 1;
            transform: translateY(0);
        }

        .vision-card-action {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
            font-family: 'Inter', system-ui, sans-serif;
            color: #52525b;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 120ms ease;
        }
        .vision-card-action:hover {
            color: #a1a1aa;
            background: rgba(255,255,255,0.05);
        }
        .vision-card-action--complete {
            color: rgba(244,114,182,0.6);
        }
        .vision-card-action--complete:hover {
            color: #f472b6;
            background: rgba(244,114,182,0.08);
        }
        .vision-card-action--restore {
            color: rgba(244,114,182,0.6);
        }
        .vision-card-action--restore:hover {
            color: #f472b6;
            background: rgba(244,114,182,0.08);
        }
        .vision-card-action--delete:hover {
            color: #ef4444;
            background: rgba(239,68,68,0.08);
        }

        /* ── Empty State ─────────────────────────────────────── */
        .vision-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            text-align: center;
        }
        .vision-empty-icon {
            font-size: 56px;
            opacity: 0.15;
            margin-bottom: 16px;
        }

        /* North Star hero state */
        .vision-empty-star {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(244,114,182,0.06);
            border: 1px solid rgba(244,114,182,0.1);
            color: rgba(244,114,182,0.4);
            margin-bottom: 24px;
            animation: star-breathe 3s ease-in-out infinite;
        }
        @keyframes star-breathe {
            0%, 100% { box-shadow: 0 0 20px rgba(244,114,182,0.08); transform: scale(1); }
            50%      { box-shadow: 0 0 40px rgba(244,114,182,0.15); transform: scale(1.05); }
        }

        .vision-empty-title {
            font-size: 15px;
            font-weight: 500;
            color: #a1a1aa;
            margin: 0 0 6px;
        }
        .vision-empty-title--hero {
            font-size: 22px;
            font-weight: 700;
            color: #f4f4f5;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .vision-empty-hint {
            font-size: 13px;
            color: #52525b;
            margin: 0;
            max-width: 340px;
        }
        .vision-empty-hint--hero {
            font-size: 14px;
            color: #71717a;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .vision-empty-trigger {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', system-ui, sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #f472b6 0%, #c084fc 100%);
            border: none;
            cursor: pointer;
            transition: all 200ms cubic-bezier(0.45,0,0.55,1);
            box-shadow: 0 4px 20px rgba(244,114,182,0.25),
                        0 0 0 1px rgba(244,114,182,0.1);
        }
        .vision-empty-trigger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(244,114,182,0.35),
                        0 0 0 1px rgba(244,114,182,0.15);
        }
        .vision-empty-trigger:active {
            transform: translateY(0) scale(0.98);
        }

        /* ── Vision Card Responsive ──────────────────────────── */
        @media (max-width: 767px) {
            .vision-card-inner {
                padding: 18px;
                gap: 14px;
            }
            .vision-card-footer {
                padding: 8px 18px 12px;
            }
            .vision-card-title {
                font-size: 15px;
            }
            .vision-card-emoji {
                font-size: 24px;
            }
            .vision-ring {
                width: 72px;
                height: 72px;
            }
            .vision-card-pct {
                font-size: 16px;
            }
            .vision-card-pills {
                gap: 4px;
            }
            .vision-card-pill {
                padding: 4px 8px;
            }
            .vision-card-pill-label {
                font-size: 11px;
                max-width: 120px;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="bg-surface-canvas text-text-primary font-body antialiased overflow-hidden selection:bg-accent-tasks/20 selection:text-text-primary">

    <div id="app" class="flex h-screen w-screen overflow-hidden">

        <!-- Sidebar (rendered by Shell) -->
        <aside id="sidebar" class="flex-shrink-0 h-full z-40"></aside>

        <!-- Main content -->
        <main id="main-content" class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
            <div id="viewport" class="flex-1 overflow-y-auto overflow-x-hidden"></div>
        </main>
    </div>

    <!-- Modal Portal -->
    <div id="modal-portal" class="fixed inset-0 z-50 pointer-events-none"></div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

    <script type="module" src="./core/main.js"></script>
</body>
</html>
