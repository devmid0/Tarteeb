<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f11">
    <title>Tarteeb</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Inter', 'system-ui', 'sans-serif'],
                        body: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        surface: {
                            canvas:    '#0f0f11',
                            raised:    '#161619',
                            elevated:  '#1c1c20',
                            floating:  '#232328',
                            modal:     '#2c2c31',
                        },
                        text: {
                            primary:   '#f4f4f5',
                            secondary: '#a1a1aa',
                            tertiary:  '#71717a',
                            disabled:  '#52525b',
                        },
                        accent: {
                            finance:   '#60a5fa',
                            tasks:     '#34d399',
                            knowledge: '#c084fc',
                            habits:    '#fb923c',
                            goals:     '#f472b6',
                        },
                        status: {
                            success: '#22c55e',
                            warning: '#eab308',
                            error:   '#ef4444',
                            info:    '#3b82f6',
                        },
                    },
                    boxShadow: {
                        surface:  '0 1px 2px rgba(0,0,0,0.4)',
                        raised:   '0 4px 12px rgba(0,0,0,0.5)',
                        elevated: '0 8px 24px rgba(0,0,0,0.6)',
                        floating: '0 12px 40px rgba(0,0,0,0.7)',
                        modal:    '0 20px 60px rgba(0,0,0,0.8)',
                    },
                    animation: {
                        entrance:    'entrance 350ms cubic-bezier(0.34,1.56,0.64,1) forwards',
                        exit:        'exit 200ms cubic-bezier(0.55,0,1,0.45) forwards',
                        reposition:  'reposition 350ms cubic-bezier(0.45,0,0.55,1) forwards',
                        'pulse-soft':'pulse-soft 2s ease-in-out infinite',
                    },
                    keyframes: {
                        entrance: {
                            '0%':   { opacity:'0', transform:'scale(0.97) translateY(6px)' },
                            '100%': { opacity:'1', transform:'scale(1) translateY(0)' },
                        },
                        exit: {
                            '0%':   { opacity:'1', transform:'scale(1) translateY(0)' },
                            '100%': { opacity:'0', transform:'scale(0.98) translateY(-4px)' },
                        },
                        reposition: {
                            '0%':   { opacity:'0.7', transform:'translateY(-4px)' },
                            '100%': { opacity:'1', transform:'translateY(0)' },
                        },
                        'pulse-soft': {
                            '0%, 100%': { opacity:'0.4' },
                            '50%':      { opacity:'0.8' },
                        },
                    },
                },
            },
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        html { -webkit-overflow-scrolling: touch; }

        *:focus-visible {
            outline: 2px solid #34d399;
            outline-offset: 2px;
            border-radius: 6px;
        }

        .glass {
            background: rgba(22, 22, 25, 0.85);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="bg-surface-canvas text-text-primary font-body antialiased overflow-hidden selection:bg-accent-tasks/20 selection:text-text-primary">

    <div id="app" class="flex h-screen w-screen overflow-hidden">

        <!-- Sidebar (rendered by Shell) -->
        <aside id="sidebar" class="flex-shrink-0 h-full z-40"></aside>

        <!-- Main content -->
        <main id="main-content" class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
            <div id="viewport" class="flex-1 overflow-y-auto overflow-x-hidden"></div>
        </main>
    </div>

    <!-- Modal Portal -->
    <div id="modal-portal" class="fixed inset-0 z-50 pointer-events-none"></div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

    <script type="module" src="./core/main.js"></script>
</body>
</html>
